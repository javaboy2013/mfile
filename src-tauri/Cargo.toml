[package]
name = "mfile"
version = "0.1.2"
description = "A fast, Finder alternative file manager for macOS"
edition = "2021"

[lib]
name = "mfile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSValue", "NSGeometry", "NSArray", "alloc"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSColor", "NSAppearance"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAAnimation", "CAGradientLayer", "CATextLayer", "CAMediaTiming", "CAMediaTimingFunction", "CATransaction"] }
block2 = "0.6"
objc2-core-graphics = { version = "0.3", features = ["CGColor"] }
objc2-core-foundation = "0.3"

[profile.release]
opt-level = 3
lto = true
