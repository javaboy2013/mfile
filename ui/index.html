<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mfile</title>
<style>
  :root {
    --bg: #1e1e20;
    --panel: #26262a;
    --panel-2: #2d2d32;
    --border: #3a3a40;
    --text: #e8e8ea;
    --text-dim: #9a9aa2;
    --accent: #4a9eff;
    --danger: #ff5c5c;
    --radius: 8px;
    --hover: #38383e;
    --row-hover: #2b2b30;
    --sel: #1e4d80;
    --sel-text: #ffffff;
    --toast-ok-bg: #1e1e20;
    --toast-ok-border: #3a3a40;
    --toast-err-bg: #4a1f1f;
    --toast-err-border: #6b2525;
    --scrollbar: #44444c;
  }
  /* 浅色主题 */
  html[data-theme="light"] {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --panel-2: #f0f0f3;
    --border: #d8d8de;
    --text: #1d1d1f;
    --text-dim: #6e6e73;
    --accent: #0a84ff;
    --danger: #e03030;
    --hover: #e8e8ec;
    --row-hover: #f2f2f6;
    --sel: #0a84ff;
    --sel-text: #ffffff;
    --toast-ok-bg: #ffffff;
    --toast-ok-border: #d8d8de;
    --toast-err-bg: #fdf0ef;
    --toast-err-border: #e03030;
    --scrollbar: #c5c5cc;
  }
  /* 护眼主题 */
  html[data-theme="sepia"] {
    --bg: #f0e6d6;
    --panel: #f7efe1;
    --panel-2: #e9dfcc;
    --border: #d3c5a8;
    --text: #3a3020;
    --text-dim: #857757;
    --accent: #a06d2c;
    --danger: #b53d2e;
    --hover: #e2d5ba;
    --row-hover: #eee2cb;
    --sel: #a06d2c;
    --sel-text: #fdf8ee;
    --toast-ok-bg: #f7efe1;
    --toast-ok-border: #d3c5a8;
    --toast-err-bg: #f6e3dc;
    --toast-err-border: #b53d2e;
    --scrollbar: #c8b98f;
  }
  /* 蓝色主题 */
  html[data-theme="ocean"] {
    --bg: #10202e;
    --panel: #17293a;
    --panel-2: #1e3448;
    --border: #2a4560;
    --text: #dfeaf4;
    --text-dim: #8aa3b8;
    --accent: #35c3d6;
    --danger: #ff6b6b;
    --hover: #26405a;
    --row-hover: #1d3348;
    --sel: #1c6a8a;
    --sel-text: #eafcff;
    --toast-ok-bg: #17293a;
    --toast-ok-border: #2a4560;
    --toast-err-bg: #3a1620;
    --toast-err-border: #ff6b6b;
    --scrollbar: #2c4a66;
  }
  /* 紫色主题 */
  html[data-theme="purple"] {
    --bg: #1a1622;
    --panel: #241f30;
    --panel-2: #2d2740;
    --border: #3d3455;
    --text: #ece7f6;
    --text-dim: #9c93b3;
    --accent: #a67ff5;
    --danger: #ff5c7c;
    --hover: #372f4d;
    --row-hover: #2c2540;
    --sel: #5b3a9e;
    --sel-text: #f4efff;
    --toast-ok-bg: #241f30;
    --toast-ok-border: #3d3455;
    --toast-err-bg: #3c1626;
    --toast-err-border: #ff5c7c;
    --scrollbar: #453a5f;
  }
  /* 苹果 Liquid Glass 主题 */
  html[data-theme="glass"] {
    --bg: rgba(255, 255, 255, 0.06);
    --panel: rgba(255, 255, 255, 0.12);
    --panel-2: rgba(255, 255, 255, 0.2);
    --border: rgba(255, 255, 255, 0.35);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.72);
    --accent: #ffffff;
    --danger: #ff6961;
    --hover: rgba(255, 255, 255, 0.28);
    --row-hover: rgba(255, 255, 255, 0.14);
    --sel: rgba(255, 255, 255, 0.32);
    --sel-text: #ffffff;
    --toast-ok-bg: rgba(255, 255, 255, 0.16);
    --toast-ok-border: rgba(255, 255, 255, 0.4);
    --toast-err-bg: rgba(120, 30, 30, 0.5);
    --toast-err-border: rgba(255, 120, 120, 0.7);
    --scrollbar: rgba(255, 255, 255, 0.4);
    --glass-blur: 24px;
    --glass-highlight: rgba(255, 255, 255, 0.5);
  }
  /* Liquid Glass 主题（按 Apple HIG 规范：玻璃只给控件层，内容区不透明） */
  html[data-theme="glass"] {
    --bg: #1d1e26;
    --panel: rgba(255, 255, 255, 0.1);
    --panel-2: rgba(255, 255, 255, 0.16);
    --border: rgba(255, 255, 255, 0.22);
    --text: #f5f5f7;
    --text-dim: rgba(245, 245, 247, 0.65);
    --accent: #4a8c88;
    --danger: #ff6961;
    --hover: rgba(0, 0, 0, 0.28);
    --row-hover: rgba(255, 255, 255, 0.07);
    --sel: rgba(10, 132, 255, 0.45);
    --sel-text: #ffffff;
    --toast-ok-bg: rgba(38, 40, 50, 0.85);
    --toast-ok-border: rgba(255, 255, 255, 0.25);
    --toast-err-bg: rgba(80, 28, 32, 0.88);
    --toast-err-border: rgba(255, 110, 110, 0.5);
    --scrollbar: rgba(255, 255, 255, 0.35);
  }
  /* 壁纸氛围底：单色深蓝灰，玻璃靠 backdrop-blur 呈现质感 */
  html[data-theme="glass"] body {
    background: #2e3340 fixed;
  }
  /* 整窗统一玻璃观感：侧栏+工具栏一层玻璃 */
  html[data-theme="glass"] .sidebar {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(36px) saturate(180%) brightness(1.15);
    -webkit-backdrop-filter: blur(36px) saturate(180%) brightness(1.15);
    border-right: none;
    box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.15);
  }
  html[data-theme="glass"] .topbar,
  html[data-theme="glass"] .filterbar,
  html[data-theme="glass"] .statusbar {
    background: rgba(25, 27, 38, 0.45);
    backdrop-filter: blur(36px) saturate(180%) brightness(1.15);
    -webkit-backdrop-filter: blur(36px) saturate(180%) brightness(1.15);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }
  html[data-theme="glass"] .statusbar { border-top: 1px solid rgba(255, 255, 255, 0.15); border-bottom: none; }
  /* 内容区：淡色玻璃 tint，壁纸隐约透出（真机 Tahoe 内容区做法） */
  html[data-theme="glass"] .file-list {
    background: rgba(30, 32, 44, 0.62);
    backdrop-filter: blur(40px) saturate(160%);
    -webkit-backdrop-filter: blur(40px) saturate(160%);
  }
  /* 控件：胶囊玻璃（规范：胶囊形 + 分层高光） */
  html[data-theme="glass"] .tb-btn,
  html[data-theme="glass"] .nav-btn,
  html[data-theme="glass"] .btn {
    border-radius: 999px;
    background: rgba(20, 22, 32, 0.5);
    border: none;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.5),
      inset 0 -1px 0 rgba(0, 0, 0, 0.2),
      inset 0 0 0 1px rgba(255, 255, 255, 0.12),
      0 2px 8px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  /* 规范：hover 加深而非变亮，保对比度 */
  html[data-theme="glass"] .tb-btn:hover,
  html[data-theme="glass"] .nav-btn:hover,
  html[data-theme="glass"] .btn:hover {
    background: rgba(0, 0, 0, 0.25);
  }
  html[data-theme="glass"] .sort-select,
  html[data-theme="glass"] .filter-tags {
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(8px) saturate(150%);
    -webkit-backdrop-filter: blur(8px) saturate(150%);
  }
  /* 浮层（弹窗/右键菜单）：玻璃但更厚，保证可读 */
  html[data-theme="glass"] .modal,
  html[data-theme="glass"] .search-results,
  html[data-theme="glass"] #ctxMenu {
    background: rgba(36, 38, 48, 0.8);
    backdrop-filter: blur(36px) saturate(180%);
    -webkit-backdrop-filter: blur(36px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.25),
      0 16px 48px rgba(0, 0, 0, 0.5);
  }
  /* 选中行：accent 玻璃 */
  html[data-theme="glass"] .row.selected {
    background: rgba(10, 132, 255, 0.45);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  html[data-theme="glass"] .toast {
    background: rgba(36, 38, 48, 0.82);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 10px 32px rgba(0, 0, 0, 0.4);
  }
  html[data-theme="glass"] .toast.error {
    background: rgba(80, 28, 32, 0.88);
    border-color: rgba(255, 110, 110, 0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* 顶栏 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: no-drag;
  }
  .nav-btn {
    width: 28px; height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .nav-btn:not(:disabled):hover { background: var(--hover); }
  .crumbs {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 8px;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }
  .crumbs::-webkit-scrollbar { display: none; }
  .crumb {
    padding: 3px 8px;
    border-radius: 5px;
    cursor: pointer;
    color: var(--text-dim);
  }
  .crumb:hover { background: #38383e; color: var(--text); }
  .crumb.last { color: var(--text); font-weight: 600; }
  .crumb-sep { color: var(--text-dim); opacity: .5; }
  .toolbar-actions { display: flex; gap: 6px; }
  .tb-btn {
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    display: flex; align-items: center; gap: 4px;
  }
  .tb-btn:hover { background: var(--hover); }
  .tb-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* 主区域：侧栏 + 内容 */
  .main { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 180px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 10px 8px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .side-title {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 6px 8px 4px;
  }
  .side-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
  }
  .side-item:hover { background: var(--panel-2); }
  .side-item.active { background: var(--accent); color: #fff; }
  .side-item .ico { width: 18px; height: 18px; display: flex; align-items: center; }
  .side-item .ico svg { width: 16px; height: 16px; display: block; }

  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* 搜索/过滤条 */
  .filterbar {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .search-input {
    flex: 1;
    height: 28px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0 10px;
    font-size: 12px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-dim); }
  /* 多关键字 label 输入框 */
  .filter-tags {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    min-height: 28px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 6px;
    cursor: text;
    align-items: center;
  }
  .filter-tags:focus-within { border-color: var(--accent); }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--sel);
    color: var(--sel-text);
    border-radius: 4px;
    padding: 1px 4px 1px 7px;
    font-size: 11px;
    line-height: 18px;
    max-width: 160px;
  }
  .tag .t-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag .t-x {
    cursor: pointer;
    width: 14px; height: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 3px;
    font-size: 11px;
    opacity: .75;
  }
  .tag .t-x:hover { background: rgba(255,255,255,.25); opacity: 1; }
  .filter-tags input {
    flex: 1;
    min-width: 80px;
    border: none;
    background: transparent;
    outline: none;
    color: var(--text);
    font-size: 12px;
    height: 20px;
  }
  .filter-tags input::placeholder { color: var(--text-dim); }
  .sort-select {
    height: 28px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    padding: 0 6px;
    outline: none;
  }
  .status-text { color: var(--text-dim); font-size: 12px; white-space: nowrap; }

  /* 文件列表 */
  .file-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 14px;
    cursor: default;
  }
  .row:hover { background: var(--row-hover); }
  .row.selected { background: var(--sel); color: var(--sel-text); }
  .row .ico { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; }
  .row .ico svg { width: 18px; height: 18px; display: block; }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .name input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    padding: 2px 6px;
    font-size: 13px;
    outline: none;
  }
  .row .size, .row .date { width: 90px; color: var(--text-dim); font-size: 12px; text-align: right; flex-shrink: 0; }
  .row .date { width: 130px; }
  .row.dir-row .name { font-weight: 500; }
  .empty {
    padding: 40px;
    text-align: center;
    color: var(--text-dim);
  }

  /* 状态栏 */
  .statusbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 5px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11px;
  }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    min-width: 360px;
    max-width: 480px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  .modal h3 { font-size: 14px; margin-bottom: 12px; }
  .modal input[type=text] {
    width: 100%;
    height: 32px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0 10px;
    font-size: 13px;
    outline: none;
    margin-bottom: 14px;
  }
  .modal input[type=text]:focus { border-color: var(--accent); }
  .modal .btns { display: flex; justify-content: flex-end; gap: 8px; }
  .btn {
    height: 30px; padding: 0 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .modal .msg { color: var(--danger); font-size: 12px; margin-bottom: 10px; min-height: 14px; user-select: text; -webkit-user-select: text; cursor: text; }
  .modal .modal-body { user-select: text; -webkit-user-select: text; }

  /* toast */
  .toast {
    position: fixed;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    background: var(--toast-ok-bg);
    border: 1px solid var(--toast-ok-border);
    color: var(--text);
    padding: 8px 14px 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
    z-index: 200;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    transform: translateX(-50%) translateY(6px);
    max-width: 70vw;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toast::before {
    content: '';
    flex-shrink: 0;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .toast.error::before { background: var(--danger); }
  .toast .toast-text { user-select: text; -webkit-user-select: text; word-break: break-all; }
  .toast .toast-copy {
    flex-shrink: 0;
    height: 22px;
    padding: 0 10px;
    border: 1px solid var(--toast-err-border);
    border-radius: 5px;
    background: transparent;
    color: var(--danger);
    cursor: pointer;
    font-size: 11px;
  }
  .toast .toast-copy:hover { background: var(--toast-err-border); color: var(--text); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error {
    background: var(--toast-err-bg);
    border-color: var(--toast-err-border);
    color: var(--text);
  }

  /* 路径编辑输入框 */
  #crumbs { cursor: text; }
  #pathInput {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--text);
    padding: 4px 8px;
    font-size: 12px;
    outline: none;
    user-select: text;
  }

  /* 搜索结果面板 */
  .search-results {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    z-index: 50;
    display: flex;
    flex-direction: column;
  }
  .search-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body style="background:var(--bg, #364054)">
  <div class="topbar">
    <button class="nav-btn" id="btnBack" title="后退">‹</button>
    <button class="nav-btn" id="btnUp" title="上一级">↑</button>
    <div class="crumbs" id="crumbs"></div>
    <div class="toolbar-actions">
      <button class="tb-btn" id="btnNewFolder">＋ 文件夹</button>
      <button class="tb-btn" id="btnNewFile">＋ 文件</button>
      <button class="tb-btn" id="btnHidden">隐藏文件</button>
      <button class="tb-btn" id="btnDelete">删除</button>
      <button class="tb-btn" id="btnTheme">主题</button>
    </div>
  </div>
  <div id="ctxMenu" style="display:none;position:fixed;z-index:9999;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 0;min-width:140px;box-shadow:0 4px 16px rgba(0,0,0,.4)"></div>

  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content" style="position:relative">
      <div class="filterbar">
        <div class="filter-tags" id="filterTags">
          <input id="filterInput" placeholder="过滤当前目录… (⌘F，空格分隔多个关键字)" />
        </div>
        <select class="sort-select" id="sortSelect">
          <option value="name">按名称</option>
          <option value="size">按大小</option>
          <option value="date">按修改时间</option>
          <option value="type">按类型</option>
        </select>
        <span class="status-text" id="statusText"></span>
      </div>
      <div class="file-list" id="fileList"></div>

      <div class="search-results" id="searchPanel" style="display:none">
        <div class="search-header">
          <input class="search-input" id="searchInput" placeholder="深度搜索当前目录… (回车开始)" />
          <button class="btn" id="btnSearchClose">关闭</button>
        </div>
        <div class="file-list" id="searchList"></div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span id="sbItems"></span>
    <span id="sbSelected"></span>
    <span id="sbSize"></span>
  </div>

  <div class="toast" id="toast"></div>
  <div id="modalRoot"></div>

<script src="app.js" defer></script>
</body>
</html>
